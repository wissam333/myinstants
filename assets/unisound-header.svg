<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="UniSound API - one REST API for every soundboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1038"/>
      <stop offset="0.45" stop-color="#0e0a22"/>
      <stop offset="1" stop-color="#080512"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#a5f3fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="wf" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g fill="url(#bar)" opacity="0.9" rx="11">
    <rect x="140" y="230" width="22" height="150" rx="11"/>
    <rect x="210" y="150" width="22" height="230" rx="11"/>
    <rect x="280" y="80" width="22" height="300" rx="11"/>
    <rect x="350" y="140" width="22" height="240" rx="11"/>
    <rect x="420" y="50" width="22" height="330" rx="11"/>
    <rect x="490" y="0" width="22" height="380" rx="11"/>
    <rect x="560" y="90" width="22" height="290" rx="11"/>
    <rect x="630" y="30" width="22" height="350" rx="11"/>
    <rect x="700" y="130" width="22" height="250" rx="11"/>
    <rect x="770" y="60" width="22" height="320" rx="11"/>
    <rect x="840" y="110" width="22" height="270" rx="11"/>
    <rect x="910" y="20" width="22" height="360" rx="11"/>
    <rect x="980" y="80" width="22" height="300" rx="11"/>
    <rect x="1050" y="170" width="22" height="210" rx="11"/>
  </g>

  <path d="M0 300 C120 220 240 380 360 300 C480 220 600 380 720 300 C840 220 960 380 1080 300 C1140 260 1180 250 1200 235"
        fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" filter="url(#wf)" opacity="0.85"/>

  <text x="600" y="212" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="1">
    <tspan fill="url(#txt)">UniSound</tspan>
    <tspan fill="#22d3ee"> API</tspan>
  </text>
  <text x="600" y="262" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="600" letter-spacing="7" fill="#94a3b8">ONE REST API FOR EVERY SOUNDBOARD</text>
</svg>